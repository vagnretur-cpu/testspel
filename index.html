    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bokstavsspelet för Barn</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts för lekfull typografi -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            touch-action: manipulation;
        }

        @keyframes bounce-gentle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes pulse-shake {
            0% { transform: scale(1) rotate(0deg); }
            20% { transform: scale(1.08) rotate(-4deg); }
            40% { transform: scale(1.08) rotate(4deg); }
            60% { transform: scale(1.08) rotate(-4deg); }
            80% { transform: scale(1.08) rotate(4deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        @keyframes wrong-shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .animate-bounce-gentle {
            animation: bounce-gentle 2.2s infinite ease-in-out;
        }

        .animate-correct {
            animation: pulse-shake 0.5s ease-in-out;
        }

        .animate-wrong {
            animation: wrong-shake 0.4s ease-in-out;
        }

        /* 3D-knappeffekter för barnvänlig touch */
        .btn-3d {
            transition: all 0.1s ease;
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.2);
        }

        .btn-3d:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
        }

        /* Anpassad scrollbar för summeringen */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>

        const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZÅÄÖ".split("");

        /* ==========================================================================
           2. WEB AUDIO API - LJUDEFFEKTER
           ========================================================================== */
        let audioCtx = null;
        let isSoundOn = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!isSoundOn) return;
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const now = audioCtx.currentTime;

            if (type === 'correct') {
                const freqs = [523.25, 659.25, 783.99]; // C5 -> E5 -> G5
                freqs.forEach((f, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(f, now + i * 0.08);
                    
                    gain.gain.setValueAtTime(0.2, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.08);
                    osc.stop(now + i * 0.08 + 0.3);
                });
            } else if (type === 'wrong') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(140, now + 0.25);
                
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'win') {
                const notes = [
                    {f: 523.25, t: 0}, {f: 659.25, t: 0.12}, {f: 783.99, t: 0.24}, {f: 1046.50, t: 0.4}
                ];
                notes.forEach(n => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(n.f, now + n.t);
                    gain.gain.setValueAtTime(0.25, now + n.t);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + 0.35);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + n.t);
                    osc.stop(now + n.t + 0.35);
                });
            }
        }

        function toggleSound() {
            isSoundOn = !isSoundOn;
            document.getElementById('sound-icon').textContent = isSoundOn ? "🔊" : "🔇";
        }

        /* ==========================================================================
           3. SPELTILSTÅND OCH LOGIK
           ========================================================================== */
        let currentQuestions = [];
        let roundHistory = []; // Sparar information för slutsummeringen
        let currentQuestionIndex = 0;
        let score = 0;
        let isAnsweringAllowed = true;

        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startGame() {
            initAudio();
            score = 0;
            currentQuestionIndex = 0;
            roundHistory = [];
            
            // Slumpa 10 helt unika, enkla ord för denna omgång
            currentQuestions = shuffle(WORD_DATABASE).slice(0, 10);

            // Byt skärm
            document.getElementById("start-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.remove("flex");
            document.getElementById("game-screen").classList.remove("hidden");
            document.getElementById("game-screen").classList.add("flex");

            updateScoreUI();
            showQuestion();
        }

        function updateScoreUI() {
            document.getElementById("score-count").textContent = score;
            document.getElementById("question-number").textContent = `${currentQuestionIndex + 1}/10`;
        }

        function renderWordWithHighlight(word, isAnswered = false) {
            if (!isAnswered) {
                // Visa enbart streck om man inte svarat ännu
                return `<span class="text-indigo-300 font-bold tracking-widest">${"_ ".repeat(word.length).trim()}</span>`;
            }
            // När svar lämnats: visa ordet med första bokstaven framhävd
            const firstLetter = word.charAt(0);
            const restOfWord = word.slice(1);
            return `<span class="text-green-600 bg-green-100 px-2 py-0.5 rounded-lg border-2 border-green-400 font-black">${firstLetter}</span><span class="text-indigo-950 font-extrabold">${restOfWord}</span>`;
        }

        function showQuestion() {
            isAnsweringAllowed = true;
            updateScoreUI();

            const currentItem = currentQuestions[currentQuestionIndex];
            const correctLetter = currentItem.word.charAt(0).toUpperCase();

            // Visa Emoji
            const emojiDisplay = document.getElementById("emoji-display");
            emojiDisplay.textContent = currentItem.emoji;
            
            // Återställ kortets stil
            const emojiCard = document.getElementById("emoji-card");
            emojiCard.className = "bg-gradient-to-b from-blue-50 to-indigo-50 border-4 border-indigo-200 rounded-3xl p-5 sm:p-7 mb-4 shadow-inner w-full flex flex-col items-center justify-center transition-all duration-300 min-h-[210px]";

            // Dölj ordet i början
            const wordText = document.getElementById("word-text");
            wordText.innerHTML = renderWordWithHighlight(currentItem.word, false);

            // Generera 2 slumpmässiga felaktiga bokstäver
            let wrongLetter1, wrongLetter2;
            do {
                wrongLetter1 = ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
            } while (wrongLetter1 === correctLetter);

            do {
                wrongLetter2 = ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
            } while (wrongLetter2 === correctLetter || wrongLetter2 === wrongLetter1);

            // Blanda svarsalternativen
            const options = shuffle([correctLetter, wrongLetter1, wrongLetter2]);

            // Skapa stora färgglada knappar
            const optionsContainer = document.getElementById("options-container");
            optionsContainer.innerHTML = "";

            const buttonColors = [
                "bg-blue-500 hover:bg-blue-400 border-blue-700",
                "bg-pink-500 hover:bg-pink-400 border-pink-700",
                "bg-purple-500 hover:bg-purple-400 border-purple-700"
            ];

            options.forEach((letter, index) => {
                const btn = document.createElement("button");
                btn.className = `btn-3d ${buttonColors[index]} text-white text-5xl sm:text-6xl font-black py-5 sm:py-7 rounded-3xl border-b-4 transform hover:scale-105 transition-all cursor-pointer flex items-center justify-center shadow-lg`;
                btn.textContent = letter;
                btn.onclick = () => handleAnswer(letter, correctLetter, btn);
                optionsContainer.appendChild(btn);
            });

            // Rensa feedback-text
            const feedbackEl = document.getElementById("feedback-message");
            feedbackEl.classList.add("opacity-0");
        }

        function handleAnswer(selectedLetter, correctLetter, selectedBtn) {
            if (!isAnsweringAllowed) return;
            isAnsweringAllowed = false;

            const feedbackEl = document.getElementById("feedback-message");
            const emojiCard = document.getElementById("emoji-card");
            const currentItem = currentQuestions[currentQuestionIndex];
            const wordText = document.getElementById("word-text");

            const isCorrect = selectedLetter === correctLetter;

            // Spara resultat till historiken för slutsummeringen
            roundHistory.push({
                word: currentItem.word,
                emoji: currentItem.emoji,
                isCorrect: isCorrect
            });

            // Visa hela ordet med grönmarkerad första bokstav!
            wordText.innerHTML = renderWordWithHighlight(currentItem.word, true);

            if (isCorrect) {
                // RÄTT SVAR
                score++;
                updateScoreUI();
                playSound('correct');

                selectedBtn.className = "btn-3d bg-green-500 text-white text-5xl sm:text-6xl font-black py-5 sm:py-7 rounded-3xl border-b-4 border-green-700 shadow-lg scale-105";
                emojiCard.classList.add("animate-correct", "border-green-400", "bg-green-50");

                feedbackEl.textContent = `RÄTT! 🎉`;
                feedbackEl.className = "h-8 text-xl sm:text-2xl font-extrabold text-green-600 opacity-100 transition-opacity duration-200";

                try {
                    confetti({
                        particleCount: 25,
                        spread: 50,
                        origin: { y: 0.7 }
                    });
                } catch(e) {}

            } else {
                // FEL SVAR
                playSound('wrong');

                selectedBtn.className = "btn-3d bg-red-500 text-white text-5xl sm:text-6xl font-black py-5 sm:py-7 rounded-3xl border-b-4 border-red-700 shadow-lg opacity-80";
                emojiCard.classList.add("animate-wrong", "border-red-400", "bg-red-50");

                // Highlighta den rätta knappen så barnet ser rätt svar
                const buttons = document.querySelectorAll("#options-container button");
                buttons.forEach(btn => {
                    if (btn.textContent === correctLetter) {
                        btn.className = "btn-3d bg-green-500 text-white text-5xl sm:text-6xl font-black py-5 sm:py-7 rounded-3xl border-b-4 border-green-700 shadow-lg scale-105 animate-pulse";
                    }
                });

                feedbackEl.textContent = `Börjar på ${correctLetter}! 🎈`;
                feedbackEl.className = "h-8 text-xl sm:text-2xl font-extrabold text-red-500 opacity-100 transition-opacity duration-200";
            }

            // Gå vidare till nästa fråga efter kort pause
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < 10) {
                    showQuestion();
                } else {
                    showResults();
                }
            }, 1800);
        }

        function showResults() {
            document.getElementById("game-screen").classList.add("hidden");
            document.getElementById("game-screen").classList.remove("flex");
            
            const resultScreen = document.getElementById("result-screen");
            resultScreen.classList.remove("hidden");
            resultScreen.classList.add("flex");

            document.getElementById("final-score").textContent = score;

            const trophyEl = document.getElementById("result-trophy");
            const titleEl = document.getElementById("result-title");

            if (score === 10) {
                trophyEl.textContent = "👑";
                titleEl.textContent = "ALLA RÄTT!";
                playSound('win');
                fireConfettiRain();
            } else if (score >= 7) {
                trophyEl.textContent = "🏆";
                titleEl.textContent = "SUPERBRA!";
                playSound('win');
            } else if (score >= 5) {
                trophyEl.textContent = "🎉";
                titleEl.textContent = "BRA JOBBAT!";
            } else {
                trophyEl.textContent = "🎈";
                titleEl.textContent = "BRA FÖRSÖK!";
            }

            // BYGG SLUTSUMMERINGEN MED ALLA 10 BILDER/ORD
            const summaryGrid = document.getElementById("summary-grid");
            summaryGrid.innerHTML = "";

            roundHistory.forEach(item => {
                const itemEl = document.createElement("div");
                itemEl.className = `flex items-center justify-between p-2.5 rounded-xl border-2 ${
                    item.isCorrect ? 'bg-green-50/80 border-green-200' : 'bg-red-50/80 border-red-200'
                }`;

                const firstLetter = item.word.charAt(0);
                const restOfWord = item.word.slice(1);

                itemEl.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="text-3xl select-none">${item.emoji}</span>
                        <span class="text-lg font-bold tracking-wide">
                            <span class="text-green-600 bg-green-200/80 px-1.5 py-0.5 rounded-md font-black">${firstLetter}</span><span class="text-slate-800">${restOfWord}</span>
                        </span>
                    </div>
                    <div class="text-xl">
                        ${item.isCorrect ? '✅' : '❌'}
                    </div>
                `;

                summaryGrid.appendChild(itemEl);
            });
        }

        function fireConfettiRain() {
            try {
                var duration = 2.5 * 1000;
                var animationEnd = Date.now() + duration;

                var interval = setInterval(function() {
                    var timeLeft = animationEnd - Date.now();
                    if (timeLeft <= 0) {
                        return clearInterval(interval);
                    }
                    confetti({ particleCount: 25, startVelocity: 30, spread: 360, origin: { x: Math.random(), y: Math.random() - 0.2 } });
                }, 200);
            } catch(e) {}
        }
    </script>
</body>
</html>
